# CI del backend (Reglas §16): compilar -> pruebas (PostgreSQL real con
# Testcontainers) -> empaquetar. Si algo falla, no se despliega.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, probar y empaquetar
        # "bash mvnw": el wrapper se versiono desde Windows sin permiso de ejecucion.
        run: bash mvnw -B verify
